<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DST Technologie — Votre partenaire digital</title>
<meta name="description" content="DST Technologie, agence digitale et solutions technologiques : sites web, e-commerce, réservation et paiement en ligne (Wave, Orange Money, MTN Money, Moov Money), CRM, SEO et solutions sur mesure.">
<meta name="theme-color" content="#061340">
<link rel="icon" href="assets/logo-dst-technologie.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --ink: #0A1B4D; --ink-2: #4A5577; --ink-3: #7B86A6;
  --blue: #0062E6; --blue-2: #008AF3; --blue-dark: #0041A4; --navy: #061340; --navy-2: #0B2A75;
  --green: #47B73F; --green-dark: #267A2A;
  --bg: #F5F8FD; --card: #FFFFFF; --soft: #EAF1FE; --line: #DFE6F3; --danger: #B3261E;
  --grad: linear-gradient(135deg, #0062E6 0%, #008AF3 100%);
  --r: 20px; --r-sm: 12px; --r-lg: 28px;
  --shadow: 0 1px 2px rgba(10,27,77,.06), 0 10px 30px -12px rgba(10,27,77,.18);
  --shadow-lg: 0 30px 60px -24px rgba(6,19,64,.45);
  --wrap: 1240px; --pad: clamp(20px, 5vw, 56px);
  --font: "Plus Jakarta Sans", "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; text-wrap: pretty; }
h1, h2, h3, h4 { margin: 0; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
p { margin: 0; }
img { display: block; max-width: 100%; }
a { color: var(--blue); }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--blue-2); outline-offset: 2px; }
.app { min-height: 100vh; display: flex; flex-direction: column; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); width: 100%; }
.section { padding-top: clamp(64px, 9vw, 112px); padding-bottom: clamp(64px, 9vw, 112px); }
.section.alt { background: #fff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.section.dark { background: linear-gradient(160deg, var(--navy), var(--navy-2)); color: #fff; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); }
.eyebrow .n { display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 8px; border-radius: 99px; background: var(--soft); color: var(--blue-dark); font-size: 12px; }
.eyebrow.light { color: #9CC3FF; }
.h2 { font-size: clamp(30px, 3.8vw, 48px); max-width: 22ch; }
.lead { font-size: clamp(17px, 1.5vw, 19px); color: var(--ink-2); max-width: 58ch; line-height: 1.65; }
.head { display: flex; flex-direction: column; gap: 18px; margin-bottom: clamp(36px, 5vw, 56px); }
.head.row { flex-direction: row; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 40px; }
.head.row > div { display: flex; flex-direction: column; gap: 18px; }
.grid { display: grid; gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; border: 1px solid transparent; border-radius: 99px; font-size: 16px; font-weight: 700; line-height: 1; text-decoration: none; cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s; }
.btn svg { flex: none; }
.btn-primary { background: var(--grad); color: #fff; box-shadow: 0 10px 24px -10px rgba(0,98,230,.7); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -10px rgba(0,98,230,.75); }
.btn-outline { background: #fff; color: var(--ink); border-color: var(--line); }
.btn-outline:hover { border-color: var(--blue); color: var(--blue); }
.btn-light { background: #fff; color: var(--navy); }
.btn-light:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -12px rgba(0,0,0,.45); }
.btn-ghost-light { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
.btn-ghost-light:hover { background: rgba(255,255,255,.12); }
.btn-link { background: none; border: 0; color: var(--blue); min-height: 44px; padding: 0 4px; font-size: 15px; font-weight: 700; }
.btn-link:hover { color: var(--blue-dark); gap: 14px; }
.btn-sm { min-height: 44px; padding: 0 20px; font-size: 15px; }
.btn-icon { width: 46px; min-height: 46px; padding: 0; background: #fff; border: 1px solid var(--line); color: var(--ink); }
.btn-icon:hover { border-color: var(--blue); color: var(--blue); }
.tag { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--soft); color: var(--blue-dark); }
.tag.green { background: #E6F6E4; color: var(--green-dark); }

/* en-tête */
.top { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.86); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--line); }
.top .bar { display: flex; align-items: center; gap: 24px; padding-top: 10px; padding-bottom: 10px; }
.top .logo { margin-right: auto; display: block; line-height: 0; }
.top .logo img { height: 56px; width: auto; }
.top nav { display: flex; gap: 6px; }
.top nav a { padding: 10px 16px; border-radius: 99px; font-size: 15px; font-weight: 700; color: var(--ink); text-decoration: none; }
.top nav a:hover { background: var(--soft); }
.top nav a[aria-current="page"] { background: var(--soft); color: var(--blue); }
.top .actions { display: flex; align-items: center; gap: 10px; }
.mpanel { border-top: 1px solid var(--line); background: #fff; padding: 8px var(--pad) 24px; }
.mpanel nav { display: flex; flex-direction: column; }
.mpanel nav a { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 22px; font-weight: 800; color: var(--ink); text-decoration: none; }
.mpanel .cta { display: grid; gap: 10px; margin-top: 20px; }

/* accueil : bannière */
.hero { position: relative; overflow: hidden; color: #fff; background: radial-gradient(900px 500px at 85% -10%, rgba(0,138,243,.55), transparent 60%), radial-gradient(700px 500px at -5% 110%, rgba(71,183,63,.28), transparent 55%), linear-gradient(165deg, var(--navy) 0%, var(--navy-2) 100%); }
.hero::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse at 70% 30%, #000 10%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 70% 30%, #000 10%, transparent 70%); }
.hero .wrap { position: relative; padding-top: clamp(48px, 7vw, 96px); padding-bottom: clamp(56px, 7vw, 96px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 48px clamp(32px, 5vw, 72px); align-items: center; }
.hero h1 { font-size: clamp(42px, 6.4vw, 82px); line-height: 1.0; letter-spacing: -0.035em; margin: 22px 0 24px; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, #6CC1FF, #8BE07F); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .sub { font-size: clamp(18px, 1.6vw, 21px); color: #C9D8F6; max-width: 46ch; line-height: 1.6; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.hero .trust { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 36px; font-size: 14px; font-weight: 600; color: #B5C7EC; }
.hero .trust span { display: inline-flex; align-items: center; gap: 8px; }
.hero .trust i { width: 8px; height: 8px; border-radius: 2px; background: var(--green); display: block; }
.hero .visual { position: relative; }
.hero .photo { position: relative; aspect-ratio: 4 / 4.2; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,.18); background: var(--navy-2); }
.float { position: absolute; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: #fff; color: var(--ink); box-shadow: 0 18px 40px -16px rgba(0,0,0,.5); font-size: 13px; line-height: 1.3; animation: bob 6s ease-in-out infinite; }
.float strong { display: block; font-size: 15px; }
.float .ic { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--soft); color: var(--blue); }
.float.a { left: -18px; bottom: 12%; }
.float.b { right: -14px; top: 10%; animation-delay: -3s; }
.float.b .ic { background: #E6F6E4; color: var(--green-dark); }
@keyframes bob { 50% { transform: translateY(-10px); } }
@media (max-width: 560px) { .float.a { left: 8px; } .float.b { right: 8px; } }

/* atouts sous la bannière */
.feats { margin-top: clamp(-56px, -5vw, -40px); position: relative; z-index: 2; }
.feats .grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.feat { padding: 28px 26px; display: flex; flex-direction: column; gap: 12px; }
.feat .ic { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; background: var(--grad); color: #fff; margin-bottom: 4px; }
.feat h3 { font-size: 20px; }
.feat p { color: var(--ink-2); font-size: 15.5px; }

/* bandeau paiements */
.pay { padding: 28px 0; }
.pay .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; }
.pay .lbl { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-right: 10px; }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 99px; background: #fff; border: 1px solid var(--line); font-weight: 800; font-size: 15px; box-shadow: var(--shadow); }
.pill i { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.pill:nth-of-type(2n) i { background: var(--green); }

/* qui sommes-nous */
.about { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 48px clamp(32px, 5vw, 80px); align-items: center; }
.about .text { display: flex; flex-direction: column; gap: 24px; }
.ticks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.ticks li { display: flex; gap: 14px; align-items: center; font-weight: 700; font-size: 16px; }
.tick { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: #fff; }
.tick.sm { width: 22px; height: 22px; }
.bigstat { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 20px 24px; border-radius: var(--r) var(--r) 0 0; background: var(--grad); color: #fff; }
.bigstat b { font-size: clamp(40px, 4vw, 56px); line-height: 1; letter-spacing: -0.03em; }
.bigstat span { font-size: 15px; line-height: 1.45; opacity: .92; }
.feed { border-radius: 0 0 var(--r) var(--r); overflow: hidden; }
.feed .fh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.feed .row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.feed .row:last-of-type { border-bottom: 0; }
.feed .row time { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.feed .row b { display: block; font-size: 15px; }
.feed .row small { font-size: 13px; color: var(--ink-2); }
.figcap { margin-top: 12px; font-size: 13px; color: var(--ink-3); }

/* problèmes */
.probs { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.prob { padding: 28px; min-height: 240px; display: flex; flex-direction: column; gap: 14px; transition: transform .2s, box-shadow .2s; }
.prob:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -16px rgba(10,27,77,.3); }
.prob .num { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--soft); color: var(--blue-dark); font-weight: 800; font-size: 14px; }
.prob h3 { font-size: clamp(20px, 1.8vw, 23px); line-height: 1.22; }
.prob p { margin-top: auto; color: var(--ink-2); font-size: 15.5px; }
.prob.sol { background: var(--grad); border: 0; color: #fff; box-shadow: 0 24px 50px -20px rgba(0,98,230,.8); }
.prob.sol .eyebrow { color: #CFE3FF; }
.prob.sol h3 { color: #fff; }
.prob.sol .btn { margin-top: auto; align-self: flex-start; }

/* services : onglets */
.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px; }
.tablist { display: flex; flex-direction: column; gap: 8px; }
.tab { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink); font-size: 17px; font-weight: 700; line-height: 1.25; text-align: left; cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
.tab .n { font-size: 13px; font-weight: 800; color: var(--ink-3); }
.tab:hover { border-color: var(--blue); transform: translateX(4px); }
.tab.is-on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 14px 30px -14px rgba(0,98,230,.8); }
.tab.is-on .n { color: #CFE3FF; }
.tabpanel { padding: clamp(26px, 3.5vw, 44px); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.tabpanel .big { font-size: clamp(56px, 6vw, 88px); font-weight: 800; line-height: .9; letter-spacing: -0.04em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tabpanel h3 { font-size: clamp(26px, 2.8vw, 36px); }
.tabpanel .long { font-size: 17px; color: var(--ink-2); max-width: 52ch; line-height: 1.65; }
.fl { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px 24px; }
.fl li { display: flex; gap: 12px; align-items: center; font-size: 15.5px; font-weight: 600; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: auto; padding-top: 12px; }

/* services : grille */
.sgrid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.scard { display: flex; flex-direction: column; gap: 12px; padding: 28px 24px; min-height: 220px; color: var(--ink); text-decoration: none; transition: transform .2s, border-color .2s; }
.scard:hover { transform: translateY(-4px); border-color: var(--blue); }
.scard .n { font-size: 13px; font-weight: 800; color: var(--blue); }
.scard h3 { font-size: 20px; }
.scard p { color: var(--ink-2); font-size: 15px; }

/* pourquoi */
.why { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 24px; }
.why > div { padding: 28px 24px; border-radius: var(--r); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); display: flex; flex-direction: column; gap: 14px; }
.why .sq { width: 14px; height: 14px; border-radius: 4px; }
.why h3 { font-size: clamp(28px, 2.8vw, 36px); }
.why p { color: #C4D3F1; font-size: 16px; }
.section.dark .h2 { color: #fff; }
.section.dark .lead { color: #C4D3F1; }

/* pour qui */
.sectors { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 16px; }
.sector { padding: 24px 22px; min-height: 150px; display: flex; flex-direction: column; gap: 10px; transition: transform .2s, border-color .2s; }
.sector:hover { transform: translateY(-3px); border-color: var(--blue); }
.sector h3 { font-size: 18px; line-height: 1.2; overflow-wrap: break-word; }
.sector p { margin-top: auto; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.sector.cta { background: var(--navy); border-color: var(--navy); color: #fff; cursor: pointer; text-align: left; font-family: inherit; }
.sector.cta:hover { background: var(--navy-2); }
.sector.cta span:last-child { margin-top: auto; display: flex; align-items: center; gap: 8px; font-weight: 700; }
.sector.cta span:first-child { font-size: 18px; font-weight: 800; line-height: 1.2; }

/* processus */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 24px; counter-reset: s; }
.steps li { position: relative; padding: 28px 24px 26px; border-radius: var(--r); background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.steps .no { font-size: clamp(44px, 4.4vw, 58px); font-weight: 800; line-height: 1; letter-spacing: -0.03em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.steps li:nth-child(4) .no { background: linear-gradient(135deg, #2E9E33, #63C126); -webkit-background-clip: text; background-clip: text; }
.steps h3 { font-size: 22px; margin-top: 6px; }
.steps p { color: var(--ink-2); font-size: 16px; }

/* réalisations */
.cases { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 32px; }
.case { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.case .shot { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r); overflow: hidden; background: var(--soft); box-shadow: var(--shadow); transition: transform .3s; }
.case:hover .shot { transform: translateY(-4px); }
.case .kick { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
.case h3 { font-size: 22px; }
.case .tags { display: flex; flex-wrap: wrap; gap: 8px; }
.case.big .shot { aspect-ratio: 16 / 10; }
.case.big h2 { font-size: clamp(22px, 2.2vw, 28px); line-height: 1.15; }
.case.big .desc { color: var(--ink-2); }
.casewide { position: relative; aspect-ratio: 21 / 9; min-height: 240px; border-radius: var(--r-lg); overflow: hidden; background: var(--soft); }

/* pages */
.pagehead { padding-top: clamp(56px, 8vw, 104px); padding-bottom: clamp(36px, 5vw, 64px); background: radial-gradient(700px 300px at 90% 0%, rgba(0,138,243,.14), transparent 70%); }
.pagehead .wrap { display: flex; flex-direction: column; gap: 22px; }
.pagehead h1 { font-size: clamp(36px, 5vw, 66px); line-height: 1.04; letter-spacing: -0.03em; max-width: 18ch; }
.sindex { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.sindex button { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink); font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; transition: border-color .15s, transform .15s; }
.sindex button:hover { border-color: var(--blue); transform: translateY(-2px); }
.sindex .n { font-size: 13px; color: var(--blue); font-weight: 800; }
.sdetail { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 28px clamp(32px, 5vw, 72px); padding: 52px 0; border-top: 1px solid var(--line); scroll-margin-top: 90px; }
.sdetail .l { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sdetail .num { font-size: 15px; font-weight: 800; color: var(--blue); }
.sdetail h2 { font-size: clamp(26px, 2.8vw, 36px); }
.sdetail .long { color: var(--ink-2); font-size: 17px; max-width: 48ch; line-height: 1.65; }
.sdetail .lt { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }
.sdetail ul { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.sdetail ul li { display: flex; gap: 14px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 700; }
.sdetail ul li:last-child { border-bottom: 0; }
.sdetail ul li i { width: 10px; height: 10px; border-radius: 3px; background: var(--blue); flex: none; }

/* contact */
.contact { display: flex; flex-wrap: wrap; gap: 40px clamp(32px, 5vw, 64px); align-items: flex-start; padding-bottom: clamp(64px, 8vw, 112px); }
.formbox { flex: 7 1 540px; min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 100px; }
.stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--bg); border-bottom: 1px solid var(--line); }
.stepper > div { padding: 14px 16px 16px; border-top: 4px solid var(--line); color: var(--ink-3); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stepper > div.is-now { border-top-color: var(--blue); color: var(--ink); background: #fff; }
.stepper > div.is-done { border-top-color: var(--green); color: var(--ink); }
.stepper .n { font-size: 12px; font-weight: 800; }
.stepper .t { font-size: 14px; font-weight: 700; line-height: 1.25; overflow-wrap: break-word; }
